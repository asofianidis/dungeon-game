name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main supersedes an in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Unity license secrets
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the CI section of README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Test-

      # Runs Depthbound.EditorTools.SmokeTest.Run, which exits non-zero on any failure.
      - name: Run smoke test
        id: smoke
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: Depthbound.EditorTools.SmokeTest.Run
          versioning: None

      - name: Verify smoke test result
        if: always()
        run: |
          code="${{ steps.smoke.outputs.engineExitCode }}"
          echo "Unity exit code: ${code:-<none>}"
          [ "$code" = "0" ]

  build-windows:
    name: Build Windows
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-StandaloneWindows64-

      - name: Build player
        id: build
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          buildName: Depthbound
          versioning: None

      - name: Verify build result
        run: |
          code="${{ steps.build.outputs.engineExitCode }}"
          echo "Unity exit code: ${code:-<none>}"
          [ "$code" = "0" ]
          test -f build/StandaloneWindows64/Depthbound.exe

      - name: Package
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "ZIP=Depthbound-Windows-${short_sha}.zip" >> "$GITHUB_ENV"
          cd build/StandaloneWindows64
          # Debug symbols are not needed to play.
          rm -rf *_BurstDebugInformation_DoNotShip *_BackUpThisFolder_ButDontShipItWithYourGame
          zip -qr "$GITHUB_WORKSPACE/Depthbound-Windows-${short_sha}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: Depthbound-Windows
          path: ${{ env.ZIP }}
          retention-days: 30

      # Rolling pre-release that always holds the latest build of main.
      - name: Publish "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$ZIP" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automated Windows build of main at ${GITHUB_SHA}. Unzip and run Depthbound.exe."
